<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>瑞克和莫蒂 · 多元宇宙人格测试</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #0b1a2e;
            font-family: 'Segoe UI', 'Poppins', 'Roboto', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            color: #e4f1f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        /* 左上角传送枪 - 放大 */
        .portal-gun {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 250px;      /* 原80px，放大到140px */
            height: auto;
            opacity: 0.75;
            z-index: 10;
            pointer-events: none;
            transition: transform 0.2s ease;
        }
        /* 右下角传送门 - 放大 */
        .portal {
            position: fixed;
            bottom: 20px;
            right: 10px;
            width: 350px;      /* 原100px，放大到160px */
            height: auto;
            opacity: 1;
            z-index: 10;
            pointer-events: none;
            transition: transform 0.2s ease;
        }
        @media (max-width: 600px) {
            .portal-gun { width: 150px; top: 10px; left: 5px; }   /* 移动端也相应放大 */
            .portal { width: 200px; bottom: 10px; right: 5px; }
        }
        .start-screen {
            text-align: center;
            padding: 3rem 2rem;
        }
        .start-btn {
            background: #3ecf8e;
            border: none;
            padding: 15px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: #021e1a;
            cursor: pointer;
            margin-top: 2rem;
            transition: 0.2s;
            box-shadow: 0 5px 0 #1b6b4a;
        }
        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1b6b4a;
        }
        .dimensions {
            margin: 2rem 0;
            padding: 1.5rem;
            background: rgba(26, 64, 63, 0.6);
            border-radius: 1rem;
            border: 1px solid #2c5e5e;
        }
        .dim-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
        }
        .dim-item {
            background: rgba(11, 39, 39, 0.8);
            padding: 0.8rem;
            border-radius: 0.6rem;
            text-align: center;
        }
        .dim-en {
            font-size: 1.1rem;
            font-weight: bold;
            color: #3acb96;
            margin-bottom: 0.2rem;
        }
        .dim-zh {
            font-size: 0.85rem;
            color: #aad6d1;
        }
        .container {
            width: 900px;
            margin: 0 auto;
            background: rgba(8, 28, 36, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            padding: 2rem 1.8rem;
            box-shadow: 0 25px 40px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
            border: 1px solid #3ecf8e40;
            position: relative;
            z-index: 20;
        }
        h1 {
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 0.2rem;
            text-align: center;
            background: linear-gradient(135deg, #b3ffcf, #7bcb8f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .sub {
            text-align: center;
            color: #aad6d1;
            border-bottom: 1px dashed #3ecf8e60;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        .intro {
            background: #0d2c2c;
            padding: 1rem 1.5rem;
            border-radius: 1.5rem;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            border-left: 5px solid #6ed4b0;
        }
        .question-card {
            background: #102b2bcc;
            border-radius: 1.5rem;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.3rem;
            transition: all 0.2s;
            border: 1px solid #2c5e5e;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .question-text {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.8rem;
            display: flex;
            gap: 10px;
            align-items: baseline;
        }
        .q-num {
            background: #2cae7a;
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #011;
        }
        .dimension-badge {
            background: #1e4f6e;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: normal;
            letter-spacing: 0.5px;
        }
        .options {
            display: flex;
            flex-wrap: nowrap;
            gap: 0.8rem;
            justify-content: space-between;
            margin-top: 0.5rem;
        }
        .opt {
            flex: 1;
            min-width: 0;
            text-align: center;
            background: #1a403f;
            border-radius: 2rem;
            padding: 0.5rem 0.2rem;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid #479c8c;
            font-size: 0.8rem;
        }
        .opt.selected {
            background: #3acb96;
            color: #021c1a;
            font-weight: bold;
            border-color: #c1ffcf;
            box-shadow: 0 0 8px #4effb5;
        }
        .opt:hover:not(.selected) {
            background: #2f6b60;
        }
        button {
            background: #3ecf8e;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 60px;
            color: #021e1a;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: 0.2s;
            box-shadow: 0 5px 0 #1b6b4a;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1b6b4a;
        }
        .result-area {
            margin-top: 2rem;
            background: #031e1ecc;
            border-radius: 1.5rem;
            padding: 1.2rem;
            border: 1px solid #6ed4b0;
        }
        .best-match {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            background: linear-gradient(135deg, #f9f3c1, #c8ffb0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .score-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 1rem 0;
        }
        .score-row {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .score-card {
            background: #0b2727;
            border-radius: 1rem;
            padding: 0.8rem 1rem;
            text-align: center;
            min-width: 180px;
        }
        .score-label {
            font-size: 1rem;
            margin-bottom: 0.6rem;
        }
        .score-en {
            font-size: 0.75rem;
            color: #3acb96;
            font-weight: bold;
        }
        .progress-bar {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 0.6rem;
        }
        .progress-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.3s ease;
            background: linear-gradient(90deg, #3ecf8e, #2db87a);
        }
        .score-value {
            font-size: 0.85rem;
            line-height: 1.4;
        }
        .rank-list {
            max-height: 300px;
            overflow-y: auto;
            font-size: 0.85rem;
            background: #052020;
            border-radius: 1rem;
            padding: 0.5rem;
            margin-top: 1rem;
        }
        .rank-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            border-bottom: 1px solid #2f6355;
        }
        hr {
            border-color: #3f8a7a;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 2rem;
            color: #7ba396;
        }
        @media (max-width: 600px) {
            .container { padding: 1rem; width: calc(100% - 2rem) !important; }
            .opt { font-size: 0.7rem; min-width: 55px; }
            .question-card { min-height: 160px; padding: 1rem; }
            .question-text { font-size: 0.95rem; }
            .score-row { flex-direction: column; gap: 8px; }
            .score-card { min-width: 100%; }
            .best-match { font-size: 1.6rem; }
            .result-area .container { padding: 1.5rem; }
            button { padding: 10px 25px; font-size: 1rem; }
            .options { flex-wrap: wrap; gap: 0.5rem; }
            .opt:nth-child(-n+3) { flex-basis: calc(33.33% - 0.5rem); }
            .opt:nth-child(n+4) { flex-basis: calc(50% - 0.25rem); }
        }
    </style>
</head>
<body>
    <!-- 背景装饰图片：左上角传送枪，右下角传送门（已放大） -->
    <img src="./img/portal_gun.png" alt="Portal Gun" class="portal-gun">
    <img src="./img/portal.png" alt="Portal" class="portal">

    <div class="container">
        <!-- 开始界面 -->
        <div id="startScreen" class="start-screen">
            <h1>RMTI · 多元宇宙人格切片</h1>
            <div class="sub">「你更像哪一个瑞莫角色？」</div>
            <div class="intro" id="introText">
                一共<span id="questionCount">15</span>道情境题，每道题都来自C-137宇宙的真实情境。<br>
                诚实回答，诊断仪会扫描你的量子频率，找出最契合的角色。
            </div>
            <div class="dimensions">
                <div class="dim-grid">
                    <div class="dim-item">
                        <div class="dim-en">「Risk」</div>
                        <div class="dim-zh">风险偏好</div>
                    </div>
                    <div class="dim-item">
                        <div class="dim-en">「Motivation」</div>
                        <div class="dim-zh">行为动力</div>
                    </div>
                    <div class="dim-item">
                        <div class="dim-en">「Throne」</div>
                        <div class="dim-zh">权力欲望</div>
                    </div>
                    <div class="dim-item">
                        <div class="dim-en">「Interaction」</div>
                        <div class="dim-zh">人际依附</div>
                    </div>
                </div>
            </div>
            <button type="button" class="start-btn" id="startBtn">开始测试</button>
        </div>

        <!-- 测试表单 -->
        <form id="quizForm" style="display: none;">
            <!-- 进度条 -->
            <div style="margin-bottom: 1.5rem;">
                <div id="progressText" style="text-align: center; margin-bottom: 8px; font-size: 0.9rem; color: #aad6d1;">1 / 15</div>
                <div style="height: 8px; background: #0d2c2c; border-radius: 10px; overflow: hidden;">
                    <div id="progressBar" style="height: 100%; background: linear-gradient(90deg, #3ecf8e, #6ed4b0); width: 6.67%; transition: width 0.3s ease;"></div>
                </div>
            </div>
            
            <div id="questionsContainer"></div>
            
            <!-- 导航按钮 -->
            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button type="button" id="prevBtn" style="display: none;">上一题</button>
                <button type="button" id="nextBtn">下一题</button>
                <button type="button" id="submitBtn" style="display: none;">扫描频率</button>
            </div>
        </form>

        <div id="resultArea" class="result-area" style="display: none;">
            <h1>RMTI · 多元宇宙人格切片</h1>
            <div style="font-size: 1.4rem; text-align: center;">分析结果</div>
            <div id="bestMatchText" class="best-match"></div>
            <div id="scoresDisplay" class="score-grid"></div>
            <footer>「在无限平行宇宙中，每一个选择都会分裂出另一个你」</footer>
        </div>
        <footer style="display: none;">「在无限平行宇宙中，每一个选择都会分裂出另一个你」</footer>
    </div>

    <script>
        // ---------------- 定义16个角色 (名字 + [风险, 权力, 动力, 依附]) ----------------
        // 参考《瑞克和莫蒂》经典人设，精心设计的坐标 (1-10)
        const CHARACTERS = [
            { name: "瑞克",          scores: [9, 1, 8, 4] },     // 瑞克
            { name: "莫蒂",          scores: [3, 7, 2, 8] },     // 莫蒂
            { name: "原初瑞克",      scores: [5, 8, 10, 1] },    // 原初瑞克
            { name: "邪恶莫蒂",      scores: [2, 1, 10, 1] },    // 邪恶莫蒂
            { name: "杰瑞",          scores: [1, 10, 4, 9] },    // 杰瑞
            { name: "宇宙贝斯",      scores: [10, 3, 6, 2] },    // 宇宙贝斯
            { name: "使命必达",      scores: [5, 1, 10, 10] }    // 使命必达
        ];

        // ----- 20道测试题，每道题归属于一个维度 (risk, power, drive, attach)
        const QUESTIONS = [
            { text: "瑞克递给你一瓶荧光绿药剂说：“喝下去，70%几率获得超能力，30%变成黄瓜”，你会一口闷掉。", dim: "risk" },
            { text: "虽然你对中央有限曲线内的世界更熟悉，但你更想去探索曲线外的世界。", dim: "risk" },
            { text: "当你站在恐惧洞前，你会毫不犹豫跳进去面对自己最深的恐惧。", dim: "risk" },

            { text: "面对传送门另一边的未知宇宙，你会像瑞克一样直接跳进去探索，而不是纠结风险评估。", dim: "risk" },
            { text: "即使知道可能会遇到外星寄生虫或邪恶克隆体，你还是会跟着瑞克去“简单的”冒险。", dim: "risk" },


            { text: "宇宙末日即将来临，你决定去Boob World赶快享受一下。", dim: "drive", reverse: true },
            { text: "你会放弃与心爱的女孩约会，因为瑞克让你帮忙招待客人。", dim: "drive" },
            { text: "瑞克不允许你使用预知未来的死晶，但你想用它私下搞点好处。", dim: "drive", reverse: true },

            { text: "你内心有一股像原初瑞克般的使命感，推动你去改变宇宙秩序，创造属于自己的规则。", dim: "drive" },
            { text: "设定目标后，你会像贝丝一样专注到底，即使中途遇到各种疯狂状况也绝不放弃。", dim: "drive" },


            { text: "你和瑞克对于探险有不同的安排，你更想说服瑞克接受你的安排。", dim: "power"},
            { text: "瑞克议会邀请你加入，但你更喜欢自由地探索多元宇宙。", dim: "power", reverse: true },
            { text: "在史密斯一家的家庭会议中，你讨厌有人像瑞克一样颐指气使。", dim: "power" },
            { text: "你认为，奴役微型宇宙电池中的生物获取能源是值得的。", dim: "power" },
            { text: "如果你是原初瑞克，你会毫不犹豫地消灭与你意见不同的瑞克。", dim: "power" },


            { text: "躺在床上刷跨维度有线电视比参加家庭聚会有趣多了。", dim: "attach", reverse: true },
            { text: "瑞克将使命必达先生交给了你，但是你并不想使用。", dim: "attach", reverse: true },
            { text: "反抗联邦时，你更愿意与平行宇宙的自己联合作战，而不是单打独斗。", dim: "attach" },
            { text: "你无法像邪恶莫蒂一样独自享受中央有限曲线外的生活，你更喜欢和家人在一起。", dim: "attach" },
            { text: "尽管切换维度后的家人与原先的一模一样，但你还是心存芥蒂。", dim: "attach", reverse: true }
        ];

        // 随机打乱题目顺序
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        
        const SHUFFLED_QUESTIONS = shuffleArray(QUESTIONS);
        let answers = new Array(SHUFFLED_QUESTIONS.length).fill(null);
        let currentPage = 0;

        function renderCurrentQuestion() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            
            const q = SHUFFLED_QUESTIONS[currentPage];
            const card = document.createElement('div');
            card.className = 'question-card';
            
            const isMobile = window.innerWidth <= 600;
            const optionOrder = isMobile ? [2, 3, 4, 1, 5] : [1, 2, 3, 4, 5];
            
            let questionHtml = `
                <div class="question-text">
                    <span>${q.text}</span>
                </div>
                <div class="options" data-qidx="${currentPage}" data-dim="${q.dim}" data-reverse="${q.reverse || false}">
            `;
            for (let i = 0; i < optionOrder.length; i++) {
                const val = optionOrder[i];
                let label = '';
                if (val === 1) label = '非常不符';
                else if (val === 2) label = '不太符合';
                else if (val === 3) label = '中立';
                else if (val === 4) label = '比较符合';
                else label = '非常符合';
                const selectedClass = (answers[currentPage] === val) ? 'selected' : '';
                questionHtml += `<div class="opt ${selectedClass}" data-val="${val}" data-idx="${i}">${label}<br><span style="font-size:0.7rem;">${val}</span></div>`;
            }
            questionHtml += `</div>`;
            card.innerHTML = questionHtml;
            container.appendChild(card);

            updateProgressBar();

            const optDiv = document.querySelector('.options');
            const opts = optDiv.querySelectorAll('.opt');
            opts.forEach(opt => {
                opt.addEventListener('click', (e) => {
                    const val = parseInt(opt.dataset.val);
                    answers[currentPage] = val;
                    opts.forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                    
                    updateProgressBar();
                    
                    if (currentPage < SHUFFLED_QUESTIONS.length - 1) {
                        setTimeout(() => {
                            nextQuestion();
                            updateNavButtons();
                        }, 100);
                    }
                });
            });
        }

        function getAnsweredCount() {
            return answers.filter(a => a !== null).length;
        }
        
        function updateProgressBar() {
            const progress = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const totalQuestions = SHUFFLED_QUESTIONS.length;
            const answeredCount = getAnsweredCount();
            
            if (progress) {
                const percentage = (answeredCount / totalQuestions) * 100;
                progress.style.width = `${percentage}%`;
                progressText.textContent = `${answeredCount} / ${totalQuestions}`;
            }
        }

        function nextQuestion() {
            if (currentPage < SHUFFLED_QUESTIONS.length - 1) {
                currentPage++;
                renderCurrentQuestion();
            }
        }

        function prevQuestion() {
            if (currentPage > 0) {
                currentPage--;
                renderCurrentQuestion();
            }
        }

        function updateNavButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const submitBtn = document.getElementById('submitBtn');
            
            prevBtn.style.display = currentPage === 0 ? 'none' : 'block';
            nextBtn.style.display = currentPage === SHUFFLED_QUESTIONS.length - 1 ? 'none' : 'block';
            submitBtn.style.display = currentPage === SHUFFLED_QUESTIONS.length - 1 ? 'block' : 'none';
        }

        function computeDimensionScores() {
            let dimSums = { risk: 0, power: 0, drive: 0, attach: 0 };
            let dimCounts = { risk: 0, power: 0, drive: 0, attach: 0 };

            for (let i = 0; i < SHUFFLED_QUESTIONS.length; i++) {
                const q = SHUFFLED_QUESTIONS[i];
                let ans = answers[i];
                if (ans === null) return null;
                const dim = q.dim;
                let score = ans;
                if (q.reverse === true) {
                    score = 6 - ans;
                }
                dimSums[dim] += score;
                dimCounts[dim] += 1;
            }

            let rawAvg = {};
            for (let d of ['risk', 'power', 'drive', 'attach']) {
                rawAvg[d] = dimSums[d] / dimCounts[d];
            }
            let mapped = {};
            for (let d of ['risk', 'power', 'drive', 'attach']) {
                mapped[d] = 1 + (rawAvg[d] - 1) * (9 / 4);
                mapped[d] = Math.min(10, Math.max(1, mapped[d]));
            }
            return {
                risk: parseFloat(mapped.risk.toFixed(2)),
                power: parseFloat(mapped.power.toFixed(2)),
                drive: parseFloat(mapped.drive.toFixed(2)),
                attach: parseFloat(mapped.attach.toFixed(2))
            };
        }

        function calculateDistances(userVec) {
            let distances = [];
            for (let char of CHARACTERS) {
                let charVec = char.scores;
                let sumSq = 0;
                for (let i=0; i<4; i++) {
                    let diff = userVec[i] - charVec[i];
                    sumSq += diff * diff;
                }
                let dist = Math.sqrt(sumSq);
                distances.push({ name: char.name, distance: dist });
            }
            distances.sort((a,b) => a.distance - b.distance);
            return distances;
        }

        function displayResults(userScores, distances) {
            const best = distances[0];
            const bestMatchDiv = document.getElementById('bestMatchText');
            bestMatchDiv.innerHTML = `${best.name}`;

            const toPercent = (score) => Math.round(((score - 1) / 9) * 100);
            
            const scoresDiv = document.getElementById('scoresDisplay');
            scoresDiv.innerHTML = `
                <div class="score-row">
                    <div class="score-card">
                        <div class="score-label"><span class="score-en">「Risk」</span><br>风险偏好</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${toPercent(userScores.risk)}%;"></div>
                        </div>
                        <div class="score-value">${toPercent(userScores.risk)}%冒险 ${100-toPercent(userScores.risk)}%谨慎</div>
                    </div>
                    <div class="score-card">
                        <div class="score-label"><span class="score-en">「Motivation」</span><br>行为动力</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${toPercent(userScores.drive)}%;"></div>
                        </div>
                        <div class="score-value">${toPercent(userScores.drive)}%大头 ${100-toPercent(userScores.drive)}%小头</div>
                    </div>
                </div>
                <div class="score-row">
                    <div class="score-card">
                        <div class="score-label"><span class="score-en">「Throne」</span><br>权力欲望</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${toPercent(userScores.power)}%;"></div>
                        </div>
                        <div class="score-value">${toPercent(userScores.power)}%支配 ${100-toPercent(userScores.power)}%服从</div>
                    </div>
                    <div class="score-card">
                        <div class="score-label"><span class="score-en">「Interaction」</span><br>人际依附</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${toPercent(userScores.attach)}%;"></div>
                        </div>
                        <div class="score-value">${toPercent(userScores.attach)}%协作 ${100-toPercent(userScores.attach)}%独立</div>
                    </div>
                </div>
            `;

            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('quizForm').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function checkAllAnswered() {
            for (let i=0; i<answers.length; i++) {
                if (answers[i] === null) return false;
            }
            return true;
        }

        function onSubmit() {
            if (!checkAllAnswered()) {
                alert(`你还有未回答的问题！请完成全部${SHUFFLED_QUESTIONS.length}个题目，才能窥见你的宇宙镜像。`);
                return;
            }
            const userScores = computeDimensionScores();
            if (!userScores) {
                alert("数据错误，请刷新重试。");
                return;
            }
            const userVec = [userScores.risk, userScores.power, userScores.drive, userScores.attach];
            const distances = calculateDistances(userVec);
            displayResults(userScores, distances);
        }

        // 初始化界面
        document.getElementById('quizForm').style.display = 'none';
        document.getElementById('resultArea').style.display = 'none';
        document.getElementById('startScreen').style.display = 'block';
        document.getElementById('questionCount').textContent = SHUFFLED_QUESTIONS.length;
        
        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('quizForm').style.display = 'block';
            renderCurrentQuestion();
            updateNavButtons();
        });
        
        document.getElementById('prevBtn').addEventListener('click', () => {
            prevQuestion();
            updateNavButtons();
        });
        
        document.getElementById('nextBtn').addEventListener('click', () => {
            if (answers[currentPage] === null) {
                alert("请先选择一个答案！");
                return;
            }
            nextQuestion();
            updateNavButtons();
        });
        
        document.getElementById('submitBtn').addEventListener('click', onSubmit);
    </script>
</body>
</html>
